<title>我的 · 我的生活 OS</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     设计系统（锁定规范） — 主题变量可被 JS 动态切换
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    /* 默认主题：黑色背景 + 荧光黄 */
    --bg: #0E0E0F; --bg-grad: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    --card: #F8F5EE; --card-2: #1C1C20;
    --accent: #DFFF00; --accent-deep: #C4E600;
    --accent-rgb: 223,255,0;
    --accent2: #8B5CF6; --accent2-deep: #7C3AED;
    --accent2-rgb: 139,92,246;
    --text: #F8F5EE; --text-sub: #9A9AA2; --text-dim: #6B6B72;
    --line: rgba(255,255,255,0.07);
    --is-dark: 1;
    --r-lg: 28px; --r-md: 20px; --r-sm: 12px;
  }

  /* 玉桂狗主题：天空蓝 + 奶白 + 粉色 */
  .theme-cinnamoroll {
    --bg: #E8F4FD; --bg-grad: linear-gradient(165deg, #F0F8FF 0%, #E8F4FD 45%, #DCEFFF 100%);
    --card: #FFFFFF; --card-2: #F0F4F8;
    --accent: #FF8FAB; --accent-deep: #E8688A;
    --accent-rgb: 255,143,171;
    --accent2: #87CEEB; --accent2-deep: #5BB5E0;
    --accent2-rgb: 135,206,235;
    --text: #4A5568; --text-sub: #8B95A5; --text-dim: #A8B2C0;
    --line: rgba(74,85,104,0.10);
    --is-dark: 0;
  }

  /* 罗小黑主题：墨黑 + 绿色 */
  .theme-luohei {
    --bg: #0A100A; --bg-grad: linear-gradient(165deg, #0D140D 0%, #0A100A 45%, #0B120B 100%);
    --card: #F8F5EE; --card-2: #161C16;
    --accent: #4ADE80; --accent-deep: #22C55E;
    --accent-rgb: 74,222,128;
    --accent2: #6B6B72; --accent2-deep: #4A4A52;
    --accent2-rgb: 107,107,114;
    --text: #E8F5E8; --text-sub: #8A9A8A; --text-dim: #5A6A5A;
    --line: rgba(255,255,255,0.06);
    --is-dark: 1;
  }

  /* 火影主题：黑色 + 橙色 */
  .theme-naruto {
    --bg: #0E0E0F; --bg-grad: linear-gradient(165deg, #1A1410 0%, #0E0E0F 45%, #12100E 100%);
    --card: #F8F5EE; --card-2: #1C1814;
    --accent: #FF6B1A; --accent-deep: #E55510;
    --accent-rgb: 255,107,26;
    --accent2: #1A1A1A; --accent2-deep: #0A0A0A;
    --accent2-rgb: 26,26,26;
    --text: #F8F5EE; --text-sub: #9A8A7A; --text-dim: #6B6055;
    --line: rgba(255,255,255,0.07);
    --is-dark: 1;
  }

  html, body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #050506;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }
  @media (display-mode: standalone), (display-mode: fullscreen) { body { padding: 0; } }

  /* ============ iPhone Frame ============ */
  .iphone {
    position: relative;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
    background: #000;
    flex-shrink: 0;
  }
  @media (min-width: 500px) and (hover: hover) {
    .iphone {
      width: 393px;
      min-height: 852px;
      border-radius: 56px;
      padding: 12px;
      box-shadow: 0 0 0 2px #2a2a2c, 0 0 0 14px #0a0a0b,
        0 50px 90px -20px rgba(223,255,0,0.08), 0 30px 70px -10px rgba(0,0,0,0.85);
    }
    .screen { border-radius: 44px; }
  }
  .screen {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    overflow: hidden;
    isolation: isolate;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: var(--bg-grad);
    border-radius: 44px; overflow: hidden; isolation: isolate;
    transition: background .4s ease;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; transition: background .4s; }
  .glow-y { width: 240px; height: 240px; background: rgba(var(--accent-rgb),0.18); top: -60px; right: -70px; }
  .glow-p { width: 200px; height: 200px; background: rgba(var(--accent2-rgb),0.22); top: 200px; left: -80px; }
  .glow-y2 { width: 180px; height: 180px; background: rgba(var(--accent-rgb),0.08); bottom: 180px; right: -60px; }

  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; background: #000; border-radius: 20px; z-index: 100; }

  .statusbar {
    position: relative; z-index: 50; height: 54px; padding: 0 28px 6px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--text);
    transition: color .4s;
  }
  .statusbar .icons { display:flex; align-items:center; gap:6px; }
  .statusbar svg path, .statusbar svg rect, .statusbar svg line, .statusbar svg polyline { stroke: var(--text) !important; }
  .statusbar svg [fill]:not([fill="none"]) { fill: var(--text) !important; }
  .statusbar svg { display:block; }

  .content {
    position: relative; z-index: 10;
    height: calc(100% - 54px - 96px);
    overflow-y: auto; overflow-x: hidden;
    padding: 4px 20px 24px; scrollbar-width: none;
    transition: color .4s;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ============ 通用 ============ */
  .page-head { padding: 8px 2px 0; }
  .page-title { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px; margin-bottom: 6px; color: var(--text); }
  .page-title .accent { color: var(--accent); font-style: italic; }
  .page-sub { font-size: 13px; color: var(--text-sub); font-weight: 400; letter-spacing: 0.3px; }

  .section { margin-top: 24px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 2px; }
  .section-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .section-title .bar { width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .section-more { font-size: 12px; color: var(--text-sub); font-weight: 500; }

  /* ============ 个人资料卡 ============ */
  .profile-card {
    margin-top: 18px;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 22px 20px;
    position: relative; overflow: hidden;
    transition: background .4s, border-color .4s;
  }
  .profile-card::before {
    content: ''; position: absolute; width: 180px; height: 180px;
    background: rgba(var(--accent2-rgb),0.22); border-radius: 50%;
    top: -70px; right: -50px; filter: blur(30px); transition: background .4s;
  }
  .profile-card::after {
    content: ''; position: absolute; width: 110px; height: 110px;
    background: rgba(var(--accent-rgb),0.12); border-radius: 50%;
    bottom: -40px; left: -30px; filter: blur(25px); transition: background .4s;
  }
  .profile-top {
    display: flex; align-items: center; gap: 16px;
    position: relative; z-index: 2;
  }
  .avatar {
    width: 70px; height: 70px; border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: var(--bg);
    box-shadow: 0 10px 24px -6px rgba(var(--accent-rgb),0.4);
    flex-shrink: 0; transition: all .4s;
  }
  .profile-info { flex: 1; }
  .profile-name { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; color: var(--text); transition: color .4s; }
  .profile-id { font-size: 12px; color: var(--text-sub); font-weight: 500; transition: color .4s; }
  .profile-edit {
    width: 38px; height: 38px; border-radius: 13px;
    background: rgba(var(--accent-rgb),0.08); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: var(--text-sub); transition: all .4s;
  }
  .profile-bio {
    position: relative; z-index: 2; margin-top: 16px;
    font-size: 13px; color: var(--text-sub); line-height: 1.55; font-weight: 500;
    transition: color .4s;
  }
  .profile-stats {
    display: flex; gap: 10px; margin-top: 18px; position: relative; z-index: 2;
  }
  .ps {
    flex: 1; background: rgba(var(--accent-rgb),0.04); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 10px; text-align: center;
    transition: all .4s;
  }
  .ps .v { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--accent); transition: color .4s; }
  .ps .l { font-size: 10px; color: var(--text-sub); font-weight: 500; margin-top: 2px; transition: color .4s; }

  /* ============ 主题中心 ============ */
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .theme-card {
    border-radius: var(--r-md); padding: 14px;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform .2s, box-shadow .3s;
    border: 2px solid transparent;
  }
  .theme-card:active { transform: scale(0.96); }
  .theme-card.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.15); }

  .theme-preview {
    height: 72px; border-radius: 14px; margin-bottom: 10px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; padding: 8px; gap: 5px;
  }
  .tp-block { border-radius: 6px; }
  .tp-bg { position: absolute; inset: 0; }
  .tp-card { width: 28px; height: 18px; position: relative; z-index: 1; }
  .tp-accent { width: 12px; height: 12px; border-radius: 50%; position: relative; z-index: 1; }
  .tp-accent2 { width: 10px; height: 10px; border-radius: 50%; position: relative; z-index: 1; opacity: 0.6; }

  /* 默认主题预览 */
  .tp-default .tp-bg { background: linear-gradient(135deg, #141416, #0E0E10); }
  .tp-default .tp-card { background: #F8F5EE; }
  .tp-default .tp-accent { background: #DFFF00; }
  .tp-default .tp-accent2 { background: #8B5CF6; }

  /* 玉桂狗预览 */
  .tp-cinnamoroll .tp-bg { background: linear-gradient(135deg, #F0F8FF, #DCEFFF); }
  .tp-cinnamoroll .tp-card { background: #FFFFFF; }
  .tp-cinnamoroll .tp-accent { background: #FF8FAB; }
  .tp-cinnamoroll .tp-accent2 { background: #87CEEB; }

  /* 罗小黑预览 */
  .tp-luohei .tp-bg { background: linear-gradient(135deg, #0D140D, #0A100A); }
  .tp-luohei .tp-card { background: #F8F5EE; }
  .tp-luohei .tp-accent { background: #4ADE80; }
  .tp-luohei .tp-accent2 { background: #6B6B72; }

  /* 火影预览 */
  .tp-naruto .tp-bg { background: linear-gradient(135deg, #1A1410, #0E0E0F); }
  .tp-naruto .tp-card { background: #F8F5EE; }
  .tp-naruto .tp-accent { background: #FF6B1A; }
  .tp-naruto .tp-accent2 { background: #1A1A1A; border: 1px solid #333; }

  .theme-name { font-size: 13px; font-weight: 800; letter-spacing: -0.1px; color: var(--text); display: flex; align-items: center; justify-content: space-between; transition: color .4s; }
  .theme-check {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); display: none; align-items: center; justify-content: center;
    transition: background .4s;
  }
  .theme-card.active .theme-check { display: flex; }
  .theme-desc { font-size: 10px; color: var(--text-sub); font-weight: 500; margin-top: 3px; transition: color .4s; }

  /* ============ 设置组 ============ */
  .setting-group {
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: var(--r-md); overflow: hidden; margin-bottom: 12px;
    transition: background .4s, border-color .4s;
  }
  .setting-row {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px; position: relative; cursor: pointer;
    transition: background .2s;
  }
  .setting-row:active { background: rgba(var(--accent-rgb),0.04); }
  .setting-row + .setting-row::before {
    content: ''; position: absolute; top: 0; left: 56px; right: 0;
    height: 1px; background: var(--line);
  }
  .setting-ico {
    width: 34px; height: 34px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .4s;
  }
  .setting-ico.accent { background: rgba(var(--accent-rgb),0.12); color: var(--accent); }
  .setting-ico.accent2 { background: rgba(var(--accent2-rgb),0.16); color: var(--accent2); }
  .setting-ico.neutral { background: rgba(var(--accent-rgb),0.06); color: var(--text); }
  .setting-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); transition: color .4s; }
  .setting-val { font-size: 12px; color: var(--text-sub); font-weight: 500; transition: color .4s; }
  .setting-arrow { color: var(--text-dim); transition: color .4s; }

  /* 外观模式选择 */
  .appearance-row {
    display: flex; gap: 8px; padding: 14px 16px;
  }
  .ap-pill {
    flex: 1; text-align: center; padding: 10px 8px;
    border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer;
    background: rgba(var(--accent-rgb),0.04); border: 1px solid var(--line);
    color: var(--text-sub); transition: all .3s;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .ap-pill .ap-emoji { font-size: 18px; }
  .ap-pill.active {
    background: var(--accent); color: var(--bg); border-color: transparent;
  }
  .ap-pill.active .ap-emoji { filter: none; }

  /* Toggle */
  .setting-toggle {
    width: 42px; height: 25px; border-radius: 100px;
    background: var(--accent); position: relative; flex-shrink: 0; cursor: pointer;
    transition: background .3s;
  }
  .setting-toggle::after {
    content: ''; position: absolute; top: 2.5px; right: 2.5px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--bg);
    transition: all .3s;
  }
  .setting-toggle.off { background: rgba(var(--accent-rgb),0.15); }
  .setting-toggle.off::after { right: auto; left: 2.5px; background: var(--text-dim); }

  /* ============ Tab Bar ============ */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 96px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding: 12px 16px 0; z-index: 90;
    transition: background .4s, border-color .4s;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 10px; font-weight: 600; padding-top: 6px; cursor: pointer; transition: color .4s; }
  .tab svg { stroke: currentColor; }
  .tab.active { color: var(--accent); }
  .tab-center { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 0; }
  .tab-plus {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    margin-top: -18px; cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(var(--accent-rgb),0.5), 0 0 0 6px var(--bg);
    transition: all .4s;
  }
  .tab-plus svg stroke { stroke: var(--bg); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--text); border-radius: 100px; opacity: 0.5; z-index: 95; transition: background .4s; }

  /* Toast */
  .toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--accent); color: var(--bg);
    font-size: 13px; font-weight: 700; padding: 11px 20px; border-radius: 100px;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: all .35s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 10px 30px -6px rgba(var(--accent-rgb),0.5);
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 入场 */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .profile-card { animation: rise .5s ease both; }
  .section { animation: rise .5s ease both; }
  .section:nth-of-type(1) { animation-delay: .06s; }
  .section:nth-of-type(2) { animation-delay: .12s; }
  .section:nth-of-type(3) { animation-delay: .18s; }
  .section:nth-of-type(4) { animation-delay: .24s; }

  /* ============ PWA 全屏适配 ============ */
  /* 在真实手机/PWA模式下：取消手机外框，全屏铺满 */
  @media (max-width: 500px), (display-mode: standalone), (display-mode: fullscreen) {
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .iphone {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
    }
    .screen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
    }
    /* 状态栏固定顶部 */
    .statusbar {
      position: relative !important;
      flex-shrink: 0 !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
      z-index: 50 !important;
    }
    /* 内容区可滚动 */
    .content {
      position: relative !important;
      flex: 1 !important;
      height: auto !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Tab bar 固定底部 */
    .tabbar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      z-index: 90 !important;
    }
    .home-indicator {
      bottom: max(8px, env(safe-area-inset-bottom, 8px)) !important;
    }
    /* Dynamic Island 在 PWA 模式下隐藏（真机有自己的状态栏） */
    .island {
      display: none !important;
    }
    /* glow 保持 */
    .glow { pointer-events: none !important; }
  }
  /* 桌面浏览器预览：保留手机外框 */
  @media (min-width: 501px) and (hover: hover) {
    html, body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 32px 16px !important;
    }
  }

</style>
<script src="theme-inline.js"></script>
<script>
(function(){try{
  function lifeosSuppress(){
    var de=document.documentElement;
    de.classList.remove('lifeos-noentrance');
    var all=document.querySelectorAll('*'),t=[];
    for(var i=0;i<all.length;i++){var n=getComputedStyle(all[i]).animationName;if(n&&n!=='none')t.push(all[i]);}
    de.classList.add('lifeos-noentrance');
    for(var k=0;k<t.length;k++){t[k].style.animation='none';}
    var st=document.getElementById('lifeos-suppress');if(st)st.parentNode.removeChild(st);
    de.classList.remove('lifeos-noentrance');
  }
  if(sessionStorage.getItem('lifeos_inapp')){
    var s=document.createElement('style');s.id='lifeos-suppress';

    document.documentElement.classList.add('lifeos-noentrance');
    sessionStorage.removeItem('lifeos_inapp');
    if(document.readyState!=='loading')lifeosSuppress();
    else document.addEventListener('DOMContentLoaded',lifeosSuppress);
  }
  document.addEventListener('click',function(e){
    var t=e.target;

  },true);
}catch(_){}})();

<script>
const $ = id => document.getElementById(id);
const screen = $('screen');

// 主题切换 — 使用全局 API（持久化到 localStorage，跨页面生效）
function switchTheme(theme, name) {
  if (window.LifeOSTheme) {
    window.LifeOSTheme.switch(theme, name);
  }
  showToast('已切换至 ' + name);
}

// 外观模式
function selectAppearance(el) {
  document.querySelectorAll('.ap-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

// Toggle 开关
function toggleSwitch(el) {
  el.classList.toggle('off');
}

// Toast
let toastTimer;
function showToast(text) {
  $('toastText').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

// ============ 数据管理 ============
// 备份：将所有数据序列化存入 localStorage 的备份快照
function backupData() {
  if (!window.LifeOS) { showToast('存储模块未加载'); return; }
  var json = LifeOS.exportAll();
  localStorage.setItem('lifeos_backup_snapshot', json);
  localStorage.setItem('lifeos_backup_time', new Date().toLocaleString('zh-CN'));
  var bt = document.getElementById('backupTime');
  if (bt) bt.textContent = '上次：刚刚';
  showToast('✅ 备份成功');
}

// 恢复：从备份快照恢复，或从用户选择的 JSON 文件导入
function restoreData() {
  if (!window.LifeOS) { showToast('存储模块未加载'); return; }
  var input = document.getElementById('restoreFileInput');
  if (input) {
    input.value = '';
    input.onchange = function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        if (LifeOS.importAll(ev.target.result)) {
          showToast('✅ 恢复成功，刷新中…');
          setTimeout(function () { location.reload(); }, 1000);
        } else {
          showToast('❌ 文件格式错误');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  } else {
    // 降级：从备份快照恢复
    var snap = localStorage.getItem('lifeos_backup_snapshot');
    if (snap) {
      LifeOS.importAll(snap);
      showToast('✅ 已从备份恢复');
      setTimeout(function () { location.reload(); }, 1000);
    } else {
      showToast('没有可恢复的备份');
    }
  }
}

// 导出：下载 JSON 文件
function exportData() {
  if (!window.LifeOS) { showToast('存储模块未加载'); return; }
  var json = LifeOS.exportAll();
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lifeos-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ 已导出 JSON');
}

// 页面加载时显示上次备份时间
(function () {
  var t = localStorage.getItem('lifeos_backup_time');
  if (t) {
    var bt = document.getElementById('backupTime');
    if (bt) bt.textContent = '上次：' + t;
  }
})();
</script>

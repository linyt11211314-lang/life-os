<style>
  /* ============================================================
     设计系统（锁定规范）
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0E0E0F; --bg-2: #16161A;
    --card: #F8F5EE; --card-2: #1C1C20;
    --yellow: #DFFF00; --yellow-deep: #C4E600;
    --purple: #8B5CF6; --purple-deep: #7C3AED;
    --purple-soft: rgba(139,92,246,0.16);
    --text: #F8F5EE; --text-sub: #9A9AA2; --text-dim: #6B6B72;
    --line: rgba(255,255,255,0.07);
    --r-lg: 28px; --r-md: 20px; --r-sm: 12px;
  }
  html, body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #050506;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }
  @media (display-mode: standalone), (display-mode: fullscreen) { body { padding: 0; } }

  /* ============ iPhone Frame ============ */
  .iphone {
    position: relative;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
    background: #000;
    flex-shrink: 0;
  }
  @media (min-width: 500px) and (hover: hover) {
    .iphone {
      width: 393px;
      min-height: 852px;
      border-radius: 56px;
      padding: 12px;
      box-shadow: 0 0 0 2px #2a2a2c, 0 0 0 14px #0a0a0b,
        0 50px 90px -20px rgba(223,255,0,0.08), 0 30px 70px -10px rgba(0,0,0,0.85);
    }
    .screen { border-radius: 44px; }
  }
  .screen {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    overflow: hidden;
    isolation: isolate;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    border-radius: 44px; overflow: hidden; isolation: isolate;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; }
  .glow-y { width: 240px; height: 240px; background: rgba(223,255,0,0.18); top: -60px; right: -70px; }
  .glow-p { width: 200px; height: 200px; background: rgba(139,92,246,0.22); top: 180px; left: -80px; }
  .glow-y2 { width: 180px; height: 180px; background: rgba(223,255,0,0.08); bottom: 160px; right: -60px; }

  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; background: #000; border-radius: 20px; z-index: 100; }

  .statusbar {
    position: relative; z-index: 50; height: 54px; padding: 0 28px 6px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
  }
  .statusbar .icons { display:flex; align-items:center; gap:6px; }
  .statusbar svg { display:block; }

  .content {
    position: relative; z-index: 10;
    height: calc(100% - 54px - 96px);
    overflow-y: auto; overflow-x: hidden;
    padding: 4px 20px 24px; scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ============ 通用 ============ */
  .page-head { padding: 8px 2px 0; }
  .page-title { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px; margin-bottom: 6px; }
  .page-title .accent { color: var(--yellow); font-style: italic; }
  .page-sub { font-size: 13px; color: var(--text-sub); font-weight: 400; letter-spacing: 0.3px; }

  .section { margin-top: 28px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .section-title {
    font-size: 15px; font-weight: 700; letter-spacing: -0.1px;
    display: flex; align-items: center; gap: 8px; color: var(--text-sub);
  }
  .section-title .emoji { font-size: 17px; }

  /* ============ 入口卡片 ============ */
  .entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .entry-grid.single { grid-template-columns: 1fr; }

  .entry-card {
    border-radius: var(--r-md); padding: 18px 16px;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform .2s ease;
    min-height: 108px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .entry-card:active { transform: scale(0.97); }
  .entry-card.yellow { background: linear-gradient(140deg, #DFFF00 0%, #C4E600 100%); color: #0E0E10; border: none; }
  .entry-card.purple { background: linear-gradient(140deg, #8B5CF6 0%, #7C3AED 100%); color: #fff; border: none; }
  .entry-card.light { background: var(--card); color: #0E0E10; border: none; }
  .entry-card.dark { background: var(--card-2); border: 1px solid var(--line); color: var(--text); }

  .entry-card .corner {
    position: absolute; width: 60px; height: 60px; border-radius: 50%;
    top: -20px; right: -20px;
  }
  .entry-card.yellow .corner { background: rgba(14,14,16,0.08); }
  .entry-card.purple .corner { background: rgba(255,255,255,0.12); }
  .entry-card.light .corner { background: rgba(14,14,16,0.04); }
  .entry-card.dark .corner { background: rgba(255,255,255,0.05); }

  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 2; }
  .entry-emoji { font-size: 28px; line-height: 1; }
  .entry-arrow {
    font-size: 18px; font-weight: 700; opacity: 0.35;
  }
  .entry-body { position: relative; z-index: 2; }
  .entry-name { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 3px; }
  .entry-desc { font-size: 11px; font-weight: 500; opacity: 0.65; }

  /* 单列宽卡 */
  .entry-card.wide { min-height: 72px; }
  .entry-card.wide .entry-top { flex-direction: row; align-items: center; gap: 14px; }
  .entry-card.wide .entry-emoji { font-size: 26px; }
  .entry-card.wide .entry-body { flex: 1; }
  .entry-card.wide .entry-name { margin-bottom: 2px; }

  /* ============ Tab Bar ============ */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 96px;
    background: rgba(14,14,16,0.82);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding: 12px 16px 0; z-index: 90;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 10px; font-weight: 600; padding-top: 6px; cursor: pointer; }
  .tab.active { color: var(--yellow); }
  .tab-center { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 0; }
  .tab-plus {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    margin-top: -18px; cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(223,255,0,0.5), 0 0 0 6px rgba(14,14,16,0.9);
    transition: transform .15s;
  }
  .tab-plus:active { transform: scale(0.92) rotate(90deg); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--text); border-radius: 100px; opacity: 0.9; z-index: 95; }

  /* 入场 */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .page-head { animation: rise .5s ease both; }
  .section { animation: rise .5s ease both; }
  .section:nth-of-type(1) { animation-delay: .08s; }
  .section:nth-of-type(2) { animation-delay: .16s; }
  .section:nth-of-type(3) { animation-delay: .24s; }
  .section:nth-of-type(4) { animation-delay: .32s; }

  /* ============ PWA 全屏适配 ============ */
  /* 在真实手机/PWA模式下：取消手机外框，全屏铺满 */
  @media (max-width: 500px), (display-mode: standalone), (display-mode: fullscreen) {
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .iphone {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
    }
    .screen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
    }
    /* 状态栏固定顶部 */
    .statusbar {
      position: relative !important;
      flex-shrink: 0 !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
      z-index: 50 !important;
    }
    /* 内容区可滚动 */
    .content {
      position: relative !important;
      flex: 1 !important;
      height: auto !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Tab bar 固定底部 */
    .tabbar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      z-index: 90 !important;
    }
    .home-indicator {
      bottom: max(8px, env(safe-area-inset-bottom, 8px)) !important;
    }
    /* Dynamic Island 在 PWA 模式下隐藏（真机有自己的状态栏） */
    .island {
      display: none !important;
    }
    /* glow 保持 */
    .glow { pointer-events: none !important; }
  }
  /* 桌面浏览器预览：保留手机外框 */
  @media (min-width: 501px) and (hover: hover) {
    html, body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 32px 16px !important;
    }
  }

</style>

<script>
(function(){try{
  function lifeosSuppress(){
    var de=document.documentElement;
    de.classList.remove('lifeos-noentrance');
    var all=document.querySelectorAll('*'),t=[];
    for(var i=0;i<all.length;i++){var n=getComputedStyle(all[i]).animationName;if(n&&n!=='none')t.push(all[i]);}
    de.classList.add('lifeos-noentrance');
    for(var k=0;k<t.length;k++){t[k].style.animation='none';}
    var st=document.getElementById('lifeos-suppress');if(st)st.parentNode.removeChild(st);
    de.classList.remove('lifeos-noentrance');
  }
  if(sessionStorage.getItem('lifeos_inapp')){
    var s=document.createElement('style');s.id='lifeos-suppress';
    s.textContent='html.lifeos-noentrance *{animation:none!important}';
    document.head.appendChild(s);
    document.documentElement.classList.add('lifeos-noentrance');
    sessionStorage.removeItem('lifeos_inapp');
    if(document.readyState!=='loading')lifeosSuppress();
    else document.addEventListener('DOMContentLoaded',lifeosSuppress);
  }
  document.addEventListener('click',function(e){
    var t=e.target;
    while(t&&t!==document){var o=(t.getAttribute&&t.getAttribute('onclick'))||'';if(/location\.href/.test(o)){try{sessionStorage.setItem('lifeos_inapp','1');}catch(_){}break;}t=t.parentElement;}
  },true);
}catch(_){}})();
</script>

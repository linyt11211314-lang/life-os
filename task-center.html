<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E0E0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的生活 OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="我的生活 OS">
  <meta name="description" content="一个为认真生活的人打造的个人操作系统。管理待办、记录生活、规划财富、追踪周期、记录灵感。">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-startup-image" href="icons/splash-1242x2688.png">

<title>待办清单 · 我的生活 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     设计系统（锁定规范，与首页一致）
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0E0E0F;
    --bg-2: #16161A;
    --card: #F8F5EE;
    --card-2: #1C1C20;
    --yellow: #DFFF00;
    --yellow-deep: #C4E600;
    --purple: #8B5CF6;
    --purple-deep: #7C3AED;
    --purple-soft: rgba(139,92,246,0.16);
    --text: #F8F5EE;
    --text-sub: #9A9AA2;
    --text-dim: #6B6B72;
    --line: rgba(255,255,255,0.07);
    --r-lg: 28px;
    --r-md: 20px;
    --r-sm: 12px;
  }
  html, body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #050506;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }
  /* PWA 全屏模式下页面直接铺满，不再用手机外框预览 */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    body { padding: 0; }
  }

  /* ============ iPhone 14 Pro Frame ============ */
  .iphone {
    position: relative;
    width: 100%;
    max-width: 100vw;
    min-height: 100vh;
    background: #000;
    flex-shrink: 0;
  }
  @media (min-width: 500px) and (hover: hover) {
    .iphone {
      width: 393px;
      min-height: 852px;
      border-radius: 56px;
      padding: 12px;
      box-shadow: 0 0 0 2px #2a2a2c, 0 0 0 14px #0a0a0b,
        0 50px 90px -20px rgba(223,255,0,0.08), 0 30px 70px -10px rgba(0,0,0,0.85);
    }
    .screen { border-radius: 44px; }
  }
  .screen {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    overflow: hidden;
    isolation: isolate;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: linear-gradient(165deg, #141416 0%, #0E0E10 45%, #111114 100%);
    border-radius: 44px; overflow: hidden; isolation: isolate;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; }
  .glow-y { width: 240px; height: 240px; background: rgba(223,255,0,0.22); top: -60px; right: -70px; }
  .glow-p { width: 200px; height: 200px; background: rgba(139,92,246,0.28); top: 180px; left: -80px; }
  .glow-y2 { width: 180px; height: 180px; background: rgba(223,255,0,0.10); bottom: 120px; right: -60px; }

  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; background: #000; border-radius: 20px; z-index: 100; }

  .statusbar {
    position: relative; z-index: 50; height: 54px; padding: 0 28px 6px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
  }
  .statusbar .icons { display:flex; align-items:center; gap:6px; }
  .statusbar svg { display:block; }

  .content {
    position: relative; z-index: 10;
    height: calc(100% - 54px - 96px);
    overflow-y: auto; overflow-x: hidden;
    padding: 4px 20px 24px; scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ============ 页面头部 ============ */
  .page-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 8px 2px 0;
  }
  .page-top-left { flex: 1; }
  .page-title { font-size: 32px; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px; margin-bottom: 6px; }
  .page-title .accent { color: var(--yellow); font-style: italic; }
  .page-sub { font-size: 13px; color: var(--text-sub); font-weight: 400; letter-spacing: 0.3px; }

  .level-badge {
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .lv-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--yellow); color: #0E0E10;
    font-size: 13px; font-weight: 800; letter-spacing: 0.3px;
    padding: 7px 13px; border-radius: 100px;
    box-shadow: 0 6px 16px -4px rgba(223,255,0,0.4);
  }
  .lv-pill svg { display: block; }
  .streak-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    padding: 5px 10px; border-radius: 100px;
  }
  .streak-pill .fire { color: var(--yellow); }

  /* ============ Section 通用 ============ */
  .section { margin-top: 24px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .section-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; display: flex; align-items: center; gap: 8px; }
  .section-title .bar { width: 3px; height: 14px; background: var(--yellow); border-radius: 2px; }
  .section-more { font-size: 12px; color: var(--text-sub); font-weight: 500; }

  /* ============ 今日任务卡 ============ */
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-card {
    background: var(--card); border-radius: var(--r-md);
    padding: 16px; position: relative; overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease;
    cursor: pointer;
  }
  .task-card:active { transform: scale(0.98); }
  .task-card.purple { background: linear-gradient(140deg, #8B5CF6 0%, #7C3AED 100%); color: #fff; }
  .task-card.dark { background: var(--card-2); border: 1px solid var(--line); color: var(--text); }
  .task-card.done { opacity: 0.55; }
  .task-card.done .task-name { text-decoration: line-through; text-decoration-color: rgba(14,14,16,0.4); }

  .task-row { display: flex; align-items: flex-start; gap: 13px; }
  .task-check {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid rgba(14,14,16,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    cursor: pointer; position: relative;
  }
  .task-card.purple .task-check { border-color: rgba(255,255,255,0.35); }
  .task-card.dark .task-check { border-color: rgba(255,255,255,0.2); }
  .task-check.checked {
    background: var(--yellow); border-color: var(--yellow);
    transform: scale(1.05);
  }
  .task-check svg { opacity: 0; transform: scale(0.4); transition: all .3s cubic-bezier(.34,1.56,.64,1); }
  .task-check.checked svg { opacity: 1; transform: scale(1); }

  .task-body { flex: 1; min-width: 0; }
  .task-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
  .task-name { font-size: 15px; font-weight: 700; color: #0E0E10; letter-spacing: -0.2px; line-height: 1.3; }
  .task-card.purple .task-name { color: #fff; }
  .task-card.dark .task-name { color: var(--text); }
  .task-meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 100px;
    letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 4px;
  }
  .tag.cat-health { background: rgba(223,255,0,0.2); color: #5a6b00; }
  .tag.cat-study { background: rgba(139,92,246,0.18); color: #6d28d9; }
  .tag.cat-life { background: rgba(14,14,16,0.08); color: #0E0E10; }
  .tag.cat-work { background: rgba(14,14,16,0.08); color: #0E0E10; }
  .task-card.purple .tag.cat-life, .task-card.purple .tag.cat-work { background: rgba(255,255,255,0.16); color: #fff; }
  .task-card.purple .tag.cat-health { background: rgba(223,255,0,0.25); color: #0E0E10; }
  .task-card.purple .tag.cat-study { background: rgba(255,255,255,0.16); color: #fff; }
  .task-card.dark .tag.cat-health { background: rgba(223,255,0,0.15); color: var(--yellow); }
  .task-card.dark .tag.cat-study { background: rgba(139,92,246,0.2); color: var(--purple); }
  .task-card.dark .tag.cat-life, .task-card.dark .tag.cat-work { background: rgba(255,255,255,0.08); color: var(--text-sub); }

  .tag.status-progress { background: var(--yellow); color: #0E0E10; }
  .tag.status-pending { background: rgba(14,14,16,0.08); color: rgba(14,14,16,0.5); }
  .tag.status-done { background: #0E0E10; color: var(--yellow); }
  .task-card.purple .tag.status-pending { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.6); }
  .task-card.purple .tag.status-done { background: rgba(255,255,255,0.16); color: #fff; }
  .task-card.dark .tag.status-pending { background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .task-card.dark .tag.status-progress { background: var(--yellow); color: #0E0E10; }
  .task-card.dark .tag.status-done { background: rgba(223,255,0,0.15); color: var(--yellow); }

  .task-deadline { font-size: 10.5px; font-weight: 500; color: var(--text-dim); display: inline-flex; align-items: center; gap: 3px; }
  .task-card.purple .task-deadline { color: rgba(255,255,255,0.6); }
  .task-card:not(.dark):not(.purple) .task-deadline { color: rgba(14,14,16,0.45); }

  .task-bottom { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .ptrack { height: 6px; background: rgba(14,14,16,0.1); border-radius: 100px; overflow: hidden; flex: 1; }
  .task-card.purple .ptrack { background: rgba(255,255,255,0.22); }
  .task-card.dark .ptrack { background: rgba(255,255,255,0.1); }
  .pfill { height: 100%; background: #0E0E10; border-radius: 100px; transition: width .5s ease; }
  .pfill.y { background: var(--yellow); }
  .pfill.p { background: var(--purple); }
  .task-card.purple .pfill { background: var(--yellow); }
  .task-card.dark .pfill { background: var(--yellow); }
  .task-pct { font-size: 12px; font-weight: 800; color: #0E0E10; flex-shrink: 0; min-width: 32px; text-align: right; }
  .task-card.purple .task-pct { color: var(--yellow); }
  .task-card.dark .task-pct { color: var(--yellow); }

  /* 完成动画脉冲 */
  @keyframes pulse-done {
    0% { box-shadow: 0 0 0 0 rgba(223,255,0,0.5); }
    100% { box-shadow: 0 0 0 20px rgba(223,255,0,0); }
  }
  .task-check.just-done { animation: pulse-done .6s ease; }

  /* ============ 分类入口 2×2 ============ */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cat-card {
    border-radius: var(--r-md); padding: 18px 16px;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform .2s ease;
    min-height: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .cat-card:active { transform: scale(0.97); }
  .cat-card.yellow { background: linear-gradient(140deg, #DFFF00 0%, #C4E600 100%); color: #0E0E10; }
  .cat-card.purple { background: linear-gradient(140deg, #8B5CF6 0%, #7C3AED 100%); color: #fff; }
  .cat-card.light { background: var(--card); color: #0E0E10; }
  .cat-card.dark { background: var(--card-2); border: 1px solid var(--line); color: var(--text); }
  .cat-emoji { font-size: 24px; line-height: 1; margin-bottom: 8px; }
  .cat-name { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 2px; }
  .cat-count { font-size: 11px; font-weight: 600; opacity: 0.65; }
  .cat-card .cat-arrow {
    position: absolute; top: 16px; right: 16px;
    font-size: 16px; font-weight: 700; opacity: 0.4;
  }

  /* ============ 成长面板 ============ */
  .growth-card {
    background: linear-gradient(140deg, #1C1C20 0%, #16161A 100%);
    border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 22px 20px;
    position: relative; overflow: hidden;
  }
  .growth-card::before {
    content: ''; position: absolute; width: 160px; height: 160px;
    background: rgba(139,92,246,0.22); border-radius: 50%;
    top: -60px; right: -50px; filter: blur(30px);
  }
  .growth-card::after {
    content: ''; position: absolute; width: 100px; height: 100px;
    background: rgba(223,255,0,0.12); border-radius: 50%;
    bottom: -30px; left: -20px; filter: blur(25px);
  }
  .growth-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .growth-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  .growth-sub { font-size: 11px; color: var(--text-sub); font-weight: 500; margin-top: 2px; }
  .growth-lv {
    background: var(--yellow); color: #0E0E10;
    font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 100px;
  }

  .exp-bar-wrap { position: relative; z-index: 2; margin-bottom: 16px; }
  .exp-bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .exp-val { font-size: 13px; font-weight: 700; color: var(--text); }
  .exp-val .num { color: var(--yellow); font-size: 16px; }
  .exp-next { font-size: 11px; color: var(--text-sub); font-weight: 500; }
  .exp-bar { height: 10px; background: rgba(255,255,255,0.08); border-radius: 100px; overflow: hidden; position: relative; }
  .exp-fill {
    height: 100%; border-radius: 100px;
    background: linear-gradient(90deg, var(--purple) 0%, var(--yellow) 100%);
    transition: width .8s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .exp-fill::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 20px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
    border-radius: 100px;
  }

  .growth-stats { position: relative; z-index: 2; display: flex; gap: 10px; }
  .gs {
    flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 10px; text-align: center;
  }
  .gs .v { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .gs .v.y { color: var(--yellow); }
  .gs .v.p { color: var(--purple); }
  .gs .l { font-size: 10px; color: var(--text-sub); font-weight: 500; margin-top: 2px; }

  /* ============ Tab Bar ============ */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 96px;
    background: rgba(14,14,16,0.82);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding: 12px 16px 0; z-index: 90;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 10px; font-weight: 600; padding-top: 6px; cursor: pointer; }
  .tab.active { color: var(--yellow); }
  .tab-center { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 0; }
  .tab-plus {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    margin-top: -18px; cursor: pointer;
    box-shadow: 0 8px 20px -4px rgba(223,255,0,0.5), 0 0 0 6px rgba(14,14,16,0.9);
    transition: transform .2s ease;
  }
  .tab-plus:active { transform: scale(0.92) rotate(90deg); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--text); border-radius: 100px; opacity: 0.9; z-index: 95; }

  /* ============ 新增任务弹窗 ============ */
  .create-sheet {
    position: absolute; inset: 0; z-index: 200;
    background: rgba(8,8,10,0.6); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .create-sheet.show { opacity: 1; pointer-events: auto; }
  .sheet-panel {
    background: linear-gradient(165deg, #1A1A1E 0%, #141416 100%);
    border: 1px solid var(--line);
    border-radius: 32px 32px 44px 44px;
    padding: 24px 22px 30px;
    transform: translateY(100%);
    transition: transform .4s cubic-bezier(.32,.72,0,1);
    max-height: 88%;
    overflow-y: auto; scrollbar-width: none;
  }
  .create-sheet.show .sheet-panel { transform: translateY(0); }
  .sheet-panel::-webkit-scrollbar { display: none; }
  .sheet-handle {
    width: 40px; height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 100px; margin: 0 auto 18px;
  }
  .sheet-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
  .sheet-title .accent { color: var(--yellow); }
  .sheet-sub { font-size: 12px; color: var(--text-sub); margin-bottom: 22px; }

  .field { margin-bottom: 18px; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: 0.3px; margin-bottom: 8px; text-transform: uppercase; }
  .field-input {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
    font-size: 15px; font-weight: 600; color: var(--text);
    font-family: inherit; outline: none; transition: border-color .2s;
  }
  .field-input::placeholder { color: var(--text-dim); font-weight: 500; }
  .field-input:focus { border-color: var(--yellow); background: rgba(223,255,0,0.04); }
  textarea.field-input { resize: none; min-height: 60px; line-height: 1.5; font-weight: 500; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 100px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    color: var(--text-sub); cursor: pointer; transition: all .2s;
  }
  .chip.active { background: var(--yellow); color: #0E0E10; border-color: transparent; font-weight: 700; }
  .chip.active.p { background: var(--purple); color: #fff; border-color: transparent; }

  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .sheet-actions { display: flex; gap: 12px; margin-top: 8px; }
  .btn-cancel {
    flex: 1; padding: 15px; border-radius: 16px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    color: var(--text-sub); font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .btn-save {
    flex: 2; padding: 15px; border-radius: 16px;
    background: linear-gradient(135deg, var(--yellow), var(--yellow-deep));
    color: #0E0E10; font-size: 15px; font-weight: 800; cursor: pointer;
    border: none; font-family: inherit;
    box-shadow: 0 8px 20px -6px rgba(223,255,0,0.4);
    transition: transform .15s;
  }
  .btn-save:active { transform: scale(0.97); }

  /* ============ 任务详情弹窗 ============ */
  .detail-sheet {
    position: absolute; inset: 0; z-index: 200;
    background: rgba(8,8,10,0.6); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .detail-sheet.show { opacity: 1; pointer-events: auto; }
  .detail-panel {
    background: linear-gradient(165deg, #1A1A1E 0%, #141416 100%);
    border: 1px solid var(--line);
    border-radius: 32px 32px 44px 44px;
    padding: 24px 22px 30px;
    transform: translateY(100%);
    transition: transform .4s cubic-bezier(.32,.72,0,1);
    max-height: 80%; overflow-y: auto; scrollbar-width: none;
  }
  .detail-sheet.show .detail-panel { transform: translateY(0); }
  .detail-panel::-webkit-scrollbar { display: none; }

  .detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .detail-cat { font-size: 11px; font-weight: 700; color: var(--yellow); letter-spacing: 0.5px; text-transform: uppercase; }
  .detail-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .detail-name { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.25; margin-bottom: 14px; }
  .detail-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .detail-progress-section { margin-bottom: 20px; }
  .detail-progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .detail-progress-label { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.3px; }
  .detail-progress-val { font-size: 18px; font-weight: 800; color: var(--yellow); }
  .detail-note {
    background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
    font-size: 13px; color: var(--text-sub); line-height: 1.6; font-weight: 500;
    margin-bottom: 20px;
  }
  .detail-note-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }

  /* ============ Toast ============ */
  .toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--yellow); color: #0E0E10;
    font-size: 13px; font-weight: 700; padding: 11px 20px; border-radius: 100px;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: all .35s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 10px 30px -6px rgba(223,255,0,0.5);
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 入场 */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .task-card { animation: rise .4s ease both; }

  /* ============ PWA 全屏适配 ============ */
  /* 在真实手机/PWA模式下：取消手机外框，全屏铺满 */
  @media (max-width: 500px), (display-mode: standalone), (display-mode: fullscreen) {
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .iphone {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      padding: 0 !important;
      box-shadow: none !important;
    }
    .screen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
    }
    /* 状态栏固定顶部 */
    .statusbar {
      position: relative !important;
      flex-shrink: 0 !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
      z-index: 50 !important;
    }
    /* 内容区可滚动 */
    .content {
      position: relative !important;
      flex: 1 !important;
      height: auto !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Tab bar 固定底部 */
    .tabbar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      z-index: 90 !important;
    }
    .home-indicator {
      bottom: max(8px, env(safe-area-inset-bottom, 8px)) !important;
    }
    /* Dynamic Island 在 PWA 模式下隐藏（真机有自己的状态栏） */
    .island {
      display: none !important;
    }
    /* glow 保持 */
    .glow { pointer-events: none !important; }
  }
  /* 桌面浏览器预览：保留手机外框 */
  @media (min-width: 501px) and (hover: hover) {
    html, body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 32px 16px !important;
    }
  }

</style>

<script>
// ============================================================
// 任务数据
// ============================================================
const CAT_LABEL = { health:'健康', study:'学习', life:'生活', work:'工作' };
const CAT_EMOJI = { health:'💪', study:'📚', life:'🌿', work:'💼' };

// 从本地存储读取待办数据
let tasks = (window.LifeOS ? LifeOS.get('todos') : []) || [];

let exp = 380, doneCount = tasks.filter(t => t.status === 'done').length;
let selectedCat = 'life', selectedPrio = 'mid';

const $ = id => document.getElementById(id);

// 保存到本地存储
function saveTasks() {
  if (window.LifeOS) LifeOS.set('todos', tasks);
}

// ============================================================
// 渲染任务列表
// ============================================================
function renderTasks() {
  const list = $('taskList');
  list.innerHTML = '';
  tasks.forEach((t, i) => {
    const card = document.createElement('div');
    let cardCls = 'task-card';
    if (t.cardType === 'purple') cardCls += ' purple';
    if (t.cardType === 'dark') cardCls += ' dark';
    if (t.status === 'done') cardCls += ' done';
    card.className = cardCls;
    card.style.animationDelay = (i * 0.06) + 's';
    card.dataset.id = t.id;

    const statusTag = t.status === 'done' ? 'status-done' : (t.status === 'progress' ? 'status-progress' : 'status-pending');
    const statusText = t.status === 'done' ? '已完成' : (t.status === 'progress' ? '进行中' : '未开始');
    const fillCls = t.cardType === 'purple' || t.cardType === 'dark' ? '' : 'y';

    card.innerHTML = `
      <div class="task-row">
        <div class="task-check ${t.status==='done'?'checked':''}" data-id="${t.id}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="task-body">
          <div class="task-top-row">
            <div class="task-name">${t.name}</div>
          </div>
          <div class="task-meta-row">
            <span class="tag cat-${t.cat}">${CAT_EMOJI[t.cat]} ${CAT_LABEL[t.cat]}</span>
            <span class="tag ${statusTag}">${statusText}</span>
            <span class="task-deadline">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${t.deadline}
            </span>
          </div>
          <div class="task-bottom">
            <div class="ptrack"><div class="pfill ${fillCls}" style="width:${t.progress}%"></div></div>
            <div class="task-pct">${t.progress}%</div>
          </div>
        </div>
      </div>
    `;

    // 点击任务卡 → 详情
    card.addEventListener('click', e => {
      if (e.target.closest('.task-check')) return;
      openDetail(t.id);
    });

    // 点击圆形按钮 → 完成
    const check = card.querySelector('.task-check');
    check.addEventListener('click', e => {
      e.stopPropagation();
      toggleDone(t.id, check);
    });

    list.appendChild(card);
  });
  $('todayCount').textContent = tasks.length + ' 项';
}

// ============================================================
// 完成 / 取消完成
// ============================================================
function toggleDone(id, checkEl) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  if (t.status === 'done') {
    // 取消完成
    t.status = 'progress';
    t.progress = t.progress >= 100 ? 60 : t.progress;
    exp = Math.max(0, exp - 20);
    doneCount = Math.max(0, doneCount - 1);
    showToast('已取消完成');
  } else {
    // 完成
    t.status = 'done';
    t.progress = 100;
    exp += 20;
    doneCount += 1;
    checkEl.classList.add('just-done');
    setTimeout(() => checkEl.classList.remove('just-done'), 600);
    showToast('✨ 任务已完成 +20 EXP');
  }
  saveTasks(); // 持久化
  updateStats();
  setTimeout(renderTasks, 200);
}

// ============================================================
// 更新统计
// ============================================================
function updateStats() {
  $('expNum').textContent = exp;
  $('statDone').textContent = doneCount;
  const pct = Math.min(100, Math.round(exp / 500 * 100));
  $('expFill').style.width = pct + '%';
  document.querySelector('.exp-next').textContent = pct + '%';
}

// ============================================================
// Toast
// ============================================================
let toastTimer;
function showToast(text) {
  $('toastText').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

// ============================================================
// 新增任务弹窗
// ============================================================
$('addBtn').addEventListener('click', () => {
  $('createSheet').classList.add('show');
  setTimeout(() => $('fName').focus(), 350);
});
$('cancelBtn').addEventListener('click', closeCreate);
$('createSheet').addEventListener('click', e => {
  if (e.target === $('createSheet')) closeCreate();
});
function closeCreate() {
  $('createSheet').classList.remove('show');
  $('fName').value = '';
  $('fNote').value = '';
  selectedCat = 'life'; selectedPrio = 'mid';
  resetChips();
}

function resetChips() {
  document.querySelectorAll('#fCat .chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === selectedCat);
    c.classList.remove('p');
  });
  document.querySelectorAll('#fPrio .chip').forEach(c => {
    c.classList.remove('active', 'p');
    if (c.dataset.prio === selectedPrio) {
      c.classList.add('active');
      if (selectedPrio === 'high') c.classList.add('p');
    }
  });
}

document.querySelectorAll('#fCat .chip').forEach(c => {
  c.addEventListener('click', () => {
    selectedCat = c.dataset.cat;
    document.querySelectorAll('#fCat .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  });
});
document.querySelectorAll('#fPrio .chip').forEach(c => {
  c.addEventListener('click', () => {
    selectedPrio = c.dataset.prio;
    document.querySelectorAll('#fPrio .chip').forEach(x => x.classList.remove('active','p'));
    c.classList.add('active');
    if (selectedPrio === 'high') c.classList.add('p');
  });
});

$('saveBtn').addEventListener('click', () => {
  const name = $('fName').value.trim();
  if (!name) {
    $('fName').focus();
    $('fName').style.borderColor = '#ff6b6b';
    setTimeout(() => $('fName').style.borderColor = '', 1500);
    showToast('请输入任务名称');
    return;
  }
  const deadline = $('fDeadline').value.trim() || '今天 22:00';
  const note = $('fNote').value.trim() || '还没有备注～';
  const newId = Date.now();
  const cardTypes = ['light','purple','dark'];
  tasks.unshift({
    id: newId, name, cat: selectedCat, progress: 0,
    status: 'pending', deadline, note,
    cardType: cardTypes[tasks.length % 3]
  });
  saveTasks(); // 持久化
  closeCreate();
  renderTasks();
  showToast('任务已创建');
});

// ============================================================
// 任务详情
// ============================================================
function openDetail(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const statusText = t.status === 'done' ? '已完成' : (t.status === 'progress' ? '进行中' : '未开始');
  $('detailPanel').innerHTML = `
    <div class="detail-head">
      <div class="detail-cat">${CAT_EMOJI[t.cat]} ${CAT_LABEL[t.cat]} · ${statusText}</div>
      <div class="detail-close" id="detailClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F8F5EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>
    <div class="detail-name">${t.name}</div>
    <div class="detail-meta">
      <span class="tag cat-${t.cat}" style="background:rgba(139,92,246,0.18);color:#a78bfa">${CAT_EMOJI[t.cat]} ${CAT_LABEL[t.cat]}</span>
      <span class="tag ${t.status==='done'?'status-done':(t.status==='progress'?'status-progress':'status-pending')}">${statusText}</span>
      <span class="tag" style="background:rgba(255,255,255,0.06);color:var(--text-sub);border:1px solid var(--line)">⏰ ${t.deadline}</span>
    </div>
    <div class="detail-progress-section">
      <div class="detail-progress-head">
        <div class="detail-progress-label">完成进度</div>
        <div class="detail-progress-val">${t.progress}%</div>
      </div>
      <div class="ptrack" style="background:rgba(255,255,255,0.08)"><div class="pfill y" style="width:${t.progress}%"></div></div>
    </div>
    <div>
      <div class="detail-note-label">备注</div>
      <div class="detail-note">${t.note}</div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="detailCloseBtn">关闭</button>
      <button class="btn-save" id="detailToggleBtn">${t.status==='done'?'重新打开':'标记完成'}</button>
    </div>
  `;
  $('detailSheet').classList.add('show');
  $('detailClose').addEventListener('click', closeDetail);
  $('detailCloseBtn').addEventListener('click', closeDetail);
  $('detailToggleBtn').addEventListener('click', () => {
    toggleDone(t.id, {});
    closeDetail();
  });
}
function closeDetail() { $('detailSheet').classList.remove('show'); }
$('detailSheet').addEventListener('click', e => {
  if (e.target === $('detailSheet')) closeDetail();
});

// ============================================================
// 初始化
// ============================================================
renderTasks();
updateStats();
</script>
<script src="theme-runtime.js"></script>
</body>
</html>
